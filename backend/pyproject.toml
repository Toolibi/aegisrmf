[project]
name = "aegisrmf"
version = "0.1.0"
description = "AI-assisted CMMC / NIST RMF readiness platform with deterministic scoring and a secure MCP server"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "pydantic>=2.7",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
  "mcp>=2.0,<3", "pypdf>=4", "python-docx>=1.1", "openpyxl>=3.1",
  "openai>=1.60", "azure-identity>=1.19",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "pip-audit>=2.7", "cyclonedx-bom>=4"]
[project.scripts]
aegisrmf-mcp = "aegisrmf.mcp_server:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["aegisrmf*"]
[tool.setuptools.package-data]
aegisrmf = ["catalog/data/*.json", "scoring/rules/*.json"]
