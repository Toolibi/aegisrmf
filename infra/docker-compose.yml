# Local development stack. Not executed in the authoring environment.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: devonly, POSTGRES_DB: aegis }
    ports: ["5432:5432"]
  migrate:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment: { AEGIS_DATABASE_URL: "postgresql+psycopg://postgres:devonly@db:5432/aegis" }
    depends_on: [db]
  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: ../backend/.env
    environment: { AEGIS_DATABASE_URL: "postgresql+psycopg://aegis_app:devonly@db:5432/aegis" }
    ports: ["8000:8000"]
    depends_on: [migrate]
  mcp:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["aegisrmf-mcp"]
    env_file: ../backend/.env
    environment: { AEGIS_DATABASE_URL: "postgresql+psycopg://aegis_app:devonly@db:5432/aegis", AEGIS_MCP_HOST: "0.0.0.0" }
    ports: ["8001:8001"]
    depends_on: [migrate]
