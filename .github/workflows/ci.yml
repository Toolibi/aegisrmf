name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL + row-level security)
        env: { AEGIS_TEST_PG_ADMIN_URL: "postgresql+psycopg://postgres:ci@localhost:5432/postgres" }
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict
        continue-on-error: true
      - name: SBOM
        run: cyclonedx-py environment -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: backend/sbom.cdx.json }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
